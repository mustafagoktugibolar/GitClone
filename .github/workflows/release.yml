name: Release

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Derive version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      run: dotnet restore GitClone.sln

    - name: Build
      run: dotnet build GitClone.sln --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test GitClone.sln --no-build -c Release --verbosity normal

    - name: Pack ilos tool
      run: dotnet pack GitClone.Cli/GitClone.Cli.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o nupkg

    - name: Push to NuGet.org
      if: ${{ env.NUGET_API_KEY != '' }}
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: nupkg/*.nupkg
        generate_release_notes: true
